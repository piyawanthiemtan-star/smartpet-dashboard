name: Build & Deploy Purchase Dashboard

on:
  workflow_dispatch:          # กดรันเอง (= ปุ่ม refresh ในอนาคต)
  repository_dispatch:        # agent เครื่องหน้าร้านยิง event หลังอัปโหลด backup
                              # · master-updated = พอร์ทัลยิงหลังอัปไฟล์ Master ใหม่
    types: [new-backup, master-updated]
  push:                       # แก้ไฟล์เว็บใน repo แล้วขึ้นเว็บทันที ไม่ต้องรอรอบ cron
    branches: [main]
    paths: ['cloud/dist/**']
  schedule:
    - cron: '0 */2 * * *'     # ทุก 2 ชม. (UTC) — สำรอง

permissions:
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download latest POS backup (Release asset "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p backup
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "*.db" --dir backup --clobber

      - name: Generate dashboard
        env:
          SMARTPET_BACKUP_DIR: backup
          SMARTPET_MASTER: Master_Multiplier.xlsx
          SMARTPET_APPROVED: Approved_NoSubUnit.csv
          SMARTPET_OUT: output
          PYTHONIOENCODING: utf-8
        run: |
          python generate.py
          python daily_summary.py

      - name: Copy dashboard into site
        run: |
          cp output/dashboard_latest.html cloud/dist/purchasing.html
          # ML2 มีเฉพาะเมื่อ agent ML2 ส่ง backup ขึ้นมา — ไม่มีก็ข้าม ไม่ให้ build ล้ม
          if [ -f output/dashboard_ML2.html ]; then
            cp output/dashboard_ML2.html cloud/dist/purchasing-ml2.html
            echo "รวมแดชบอร์ด ML2 เข้าเว็บแล้ว"
          else
            echo "ไม่มีแดชบอร์ด ML2 รอบนี้ — ข้าม"
          fi
          # หน้าผู้บริหาร (owner เท่านั้น) — แยกไฟล์ ข้อมูลกำไรไม่ปนกับหน้าจัดซื้อ
          if [ -f output/executive_latest.html ]; then
            cp output/executive_latest.html cloud/dist/executive.html
            echo "รวมหน้าผู้บริหาร ML3 เข้าเว็บแล้ว"
          fi
          if [ -f output/executive_ML2.html ]; then
            cp output/executive_ML2.html cloud/dist/executive-ml2.html
            echo "รวมหน้าผู้บริหาร ML2 เข้าเว็บแล้ว"
          fi
          # สรุปปิดบิลสิ้นวัน (owner เท่านั้น) — ไฟล์เดียวรวมทุกสาขา เลือกวันที่ในหน้าเว็บ
          if [ -f output/daily.html ]; then
            cp output/daily.html cloud/dist/daily.html
            echo "รวมสรุปปิดบิลสิ้นวันเข้าเว็บแล้ว"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy cloud/dist --project-name lovepetglobalplus --branch main --commit-dirty=true
