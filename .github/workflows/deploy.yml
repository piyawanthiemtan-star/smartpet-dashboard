name: Build & Deploy Purchase Dashboard

on:
  workflow_dispatch:          # กดรันเอง (= ปุ่ม refresh ในอนาคต)
  repository_dispatch:        # agent เครื่องหน้าร้านยิง event หลังอัปโหลด backup
                              # · master-updated = พอร์ทัลยิงหลังอัปไฟล์ Master ใหม่
    types: [new-backup, master-updated]
  push:                       # push อะไรเข้า main ก็ build+deploy ทันที (ทั้ง repo คือ source ของเว็บ)
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'     # ทุก 2 ชม. (UTC) — สำรอง

permissions:
  contents: write   # อัปเดต release "last-good" (คลังสำรอง backup ตัวดีล่าสุดต่อสาขา)

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download latest POS backup (Release asset "latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p backup
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "*.db" --dir backup --clobber

      - name: Validate backups (ตัดไฟล์ .db ปลอม/เปล่าทิ้งก่อนใช้)
        # POS ML3 เคยปล่อยไฟล์ .db ขนาด ~1.5MB ที่ไม่มีตาราง Orders ออกมา (2 ส.ค. + 14 ส.ค. 2569)
        # agent เก็บผิดตัวแล้วลบ backup ดีทิ้ง → แดชบอร์ดถอยไป 14 วัน + ใบเบิกว่าง — กรองที่นี่กันซ้ำ
        run: |
          cat > /tmp/validate_db.py <<'PYEOF'
          import sqlite3, sys
          try:
              con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
              print("ok" if con.execute("SELECT COUNT(*) FROM Orders").fetchone()[0] > 0 else "bad")
          except Exception:
              print("bad")
          PYEOF
          for f in backup/*.db; do
            if [ "$(python /tmp/validate_db.py "$f")" != "ok" ]; then
              echo "::warning::ตัดไฟล์ backup ใช้ไม่ได้ (ไม่มีข้อมูลขาย): $f ($(stat -c%s "$f") bytes)"
              rm -f "$f"
            fi
          done
          ls -la backup/

      - name: Last-good backups (สาขาไหนหาย → ใช้ตัวดีล่าสุดแทน · ระบบไม่หยุดเพราะสาขาเดียวล่ม)
        # เหตุ 14 ส.ค. 2569: ML3 ส่งไฟล์เสียแล้ว agent ลบตัวดีทิ้งจาก release → ทั้งระบบถอย 14 วัน
        # พนักงานทำงานต่อไม่ได้ [Owner สั่ง: ระบบต้องไม่หยุด] — คลังนี้เก็บตัวดีล่าสุดต่อสาขาไว้เสมอ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view last-good --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create last-good --repo "$GITHUB_REPOSITORY" --title "Last good backups" \
              --notes "คลังสำรอง backup ตัวดีล่าสุดต่อสาขา — ระบบเติม/หมุนเวียนเองทุก build" --latest=false
          # 1) เติมสาขาที่หาย: ดึงตัวดีล่าสุดจากคลังสำรองมาใช้ (ข้อมูลเก่ากว่าปกติแต่ทีมทำงานต่อได้
          #    — ความสดจริงดูจาก MAX(Orders.Create) ในไฟล์ หัวรายงานขึ้นเตือนเองอยู่แล้ว)
          for br in ML3 ML2; do
            if ! ls backup/${br}-Backup-*.db >/dev/null 2>&1; then
              echo "::warning::ไม่มี backup ${br} ที่ใช้ได้รอบนี้ — ใช้ตัวดีล่าสุดจากคลังสำรองแทน"
              gh release download last-good --repo "$GITHUB_REPOSITORY" --pattern "${br}-Backup-*.db" --dir backup || true
            fi
          done
          # 2) เก็บตัวดีของรอบนี้เข้าคลังสำรอง (สาขาละ 1 ไฟล์ อัปเฉพาะตอนมีไฟล์ใหม่ แล้วลบตัวเก่าทิ้ง)
          for br in ML3 ML2; do
            f=$(ls -t backup/${br}-Backup-*.db 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            name=$(basename "$f")
            if ! gh release view last-good --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$name"; then
              gh release upload last-good "$f" --repo "$GITHUB_REPOSITORY" --clobber
              for a in $(gh release view last-good --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep "^${br}-Backup-" | grep -vx "$name"); do
                gh release delete-asset last-good "$a" --repo "$GITHUB_REPOSITORY" -y
              done
            fi
          done
          ls -la backup/

      - name: Generate dashboard
        env:
          SMARTPET_BACKUP_DIR: backup
          SMARTPET_MASTER: Master_Multiplier.xlsx
          SMARTPET_APPROVED: Approved_NoSubUnit.csv
          SMARTPET_OUT: output
          PYTHONIOENCODING: utf-8
        run: |
          python generate.py
          python daily_summary.py

      - name: Copy dashboard into site
        run: |
          cp output/dashboard_latest.html cloud/dist/purchasing.html
          # ML2 มีเฉพาะเมื่อ agent ML2 ส่ง backup ขึ้นมา — ไม่มีก็ข้าม ไม่ให้ build ล้ม
          if [ -f output/dashboard_ML2.html ]; then
            cp output/dashboard_ML2.html cloud/dist/purchasing-ml2.html
            echo "รวมแดชบอร์ด ML2 เข้าเว็บแล้ว"
          else
            echo "ไม่มีแดชบอร์ด ML2 รอบนี้ — ข้าม"
          fi
          # หน้าผู้บริหาร (owner เท่านั้น) — แยกไฟล์ ข้อมูลกำไรไม่ปนกับหน้าจัดซื้อ
          if [ -f output/executive_latest.html ]; then
            cp output/executive_latest.html cloud/dist/executive.html
            echo "รวมหน้าผู้บริหาร ML3 เข้าเว็บแล้ว"
          fi
          if [ -f output/executive_ML2.html ]; then
            cp output/executive_ML2.html cloud/dist/executive-ml2.html
            echo "รวมหน้าผู้บริหาร ML2 เข้าเว็บแล้ว"
          fi
          # สรุปปิดบิลสิ้นวัน (owner เท่านั้น) — ไฟล์เดียวรวมทุกสาขา เลือกวันที่ในหน้าเว็บ
          if [ -f output/daily.html ]; then
            cp output/daily.html cloud/dist/daily.html
            echo "รวมสรุปปิดบิลสิ้นวันเข้าเว็บแล้ว"
          fi
          # ใบปิดยอดฉบับบัญชี — ไม่มีตัวเลขกำไรในไฟล์ (สิทธิ์ section accounting)
          if [ -f output/daily_accounting.html ]; then
            cp output/daily_accounting.html cloud/dist/accounting-daily.html
            echo "รวมใบปิดยอดฉบับบัญชีเข้าเว็บแล้ว"
          fi

      - name: Generate ML2 requisition (ใบเบิกสินค้า — รันบนคลาวด์ ไม่พึ่งเครื่อง Owner)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # เตรียมชื่อไฟล์ให้ตรงรูปแบบที่ ml2_report.py คาดหวัง (ML2: Backup-*.db · ML3: "ML3 YYYY-MM-DD.db")
          ml2=$(ls backup/ML2-Backup-*.db 2>/dev/null | head -1)
          ml3=$(ls backup/ML3-Backup-*.db 2>/dev/null | head -1)
          if [ -z "$ml2" ] || [ -z "$ml3" ]; then
            echo "backup ไม่ครบ 2 สาขา — คงใบเบิกเดิมจาก repo ไว้"; exit 0
          fi
          mkdir -p ml2work ml3work
          cp "$ml2" "ml2work/$(basename "$ml2" | sed 's/^ML2-//')"
          read y m d <<< "$(basename "$ml3" | sed -E 's/^ML3-Backup-([0-9]+)-([0-9]+)-([0-9]+)T.*/\1 \2 \3/')"
          cp "$ml3" "$(printf 'ml3work/ML3 %04d-%02d-%02d.db' "$y" "$m" "$d")"
          if ML2R_BACKUP_DIR=ml2work ML2R_ML3_DIR=ml3work \
             ML2R_MASTER_XLSX=Master_Multiplier.xlsx ML2R_OUT=ml2out python ml2_report.py; then
            cp ml2out/requisition_document.html cloud/dist/requisition.html
            # ใบเบิกย้อนหลัง 7 วัน (ดรอปดาวน์เลือกวันที่) -> /requisition-YYYY-MM-DD
            if ls ml2out/req_days/requisition-*.html >/dev/null 2>&1; then
              cp ml2out/req_days/requisition-*.html cloud/dist/
              echo "ใบเบิกย้อนหลัง $(ls ml2out/req_days | wc -l) วัน รวมเข้าเว็บแล้ว"
            fi
            echo "ใบเบิก ML2 สร้างบนคลาวด์สำเร็จ"
          else
            echo "ml2_report ล้มเหลว — คงใบเบิกเดิมจาก repo ไว้ (build เดินต่อ)"
          fi

      - name: Generate clearance dashboard (วัดผลระบายกลุ่ม C — owner เท่านั้น)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ใช้ backup ชุดเดียวกับใบเบิก (ml2work=ML2, ml3work=ML3) — ไม่มีก็ข้าม ไม่ให้ build ล้ม
          if [ -d ml2work ] && [ -d ml3work ]; then
            if CLR_ML2_DIR=ml2work CLR_ML3_DIR=ml3work CLR_OUT=clrout/clearance.html \
               python clearance_report.py; then
              cp clrout/clearance.html cloud/dist/clearance.html
              echo "แดชบอร์ดวัดผลระบายสร้างสำเร็จ"
            else
              echo "clearance_report ล้มเหลว — คงหน้าเดิมไว้ (build เดินต่อ)"
            fi
          else
            echo "backup ไม่ครบ — ข้ามแดชบอร์ดวัดผลระบาย"
          fi

      - name: Generate supplier order page (สั่งซื้อรายซัพ — ทีมจัดซื้อ)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d ml3work ]; then
            if SUP_ML3_DIR=ml3work SUP_ML2_DIR=ml2work SUP_OUT=supout/purchasing-order.html python supplier_order.py; then
              cp supout/purchasing-order.html cloud/dist/purchasing-order.html
              echo "หน้าสั่งซื้อรายซัพสร้างสำเร็จ"
            else
              echo "supplier_order ล้มเหลว — คงหน้าเดิมไว้ (build เดินต่อ)"
            fi
          else
            echo "ไม่มี backup ML3 — ข้ามหน้าสั่งซื้อรายซัพ"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy cloud/dist --project-name lovepetglobalplus --branch main --commit-dirty=true
